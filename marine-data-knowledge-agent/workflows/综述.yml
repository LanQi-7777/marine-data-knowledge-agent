        showAuthor: true
        text: '{"root":{"children":[{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"大体题目：","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"XXX大模型知识库：海洋应用数据综述以及深度学习方法构建指导（guidance）","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"Introduction部分大体逻辑：","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（1）工作内容方面：海洋应用数据是研究海洋的基础内容，深度学习方法重要有效的工具，（具体列一下相关领域应用），我们这个综述论文就是这样做海洋应用数据综述以及深度学习方法构建指导工作，目前没有这种综述；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（2）新的综述类工作思路和方法：以往综述论文都是某个领域里大量文献，文字性归纳总结。随着大模型的快速发展，大模型Agent智能体与知识库为综述类工作提供了新的构建方法，展开介绍，...，...。我们的工作就用大模型知识库构建的方式来做综述，既能提供传统综述文字归纳总结方面的功能，又能提供一种如何利用文献和材料构建大模型知识库的研究和方法构建体系，能对所研究的“海洋应用数据综述以及深度学习方法构建”提供综述文章和知识库工具，也能为其他领域读者提供一种新的领域综述文章和知识库构建的方法体系。创新性和应用型均很强；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（3）本文要做的XXX大模型知识库。利用XXX新技术，采用XXXX文献以及网址数据，通过XXXX标签标注方法等，建立知识库体系，为海洋应用数据综述以及深度学习方法构建提供资料和工具，并且开放文献和知识库工具。方法新，工作新，工具有效实用。","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"最后，归纳总结要点写出上面三条contribution。","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"综述内容大体框架：","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（1）海洋应用数据有哪些，按学科研究领域来划分；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（2）深度学习方法应用的有哪些，直接就（1）中数据进行对应阐述介绍；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（3）从数据科学和深度学习方法两方面综合来看，这些数据怎样划分：按模态、按维度（一维、二维、三维...），按数据内容（数据体量、标签，复杂度），按深度学习任务（比如识别、检测、预测等...），以及其他方面；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（4）对当前最新深度学习方法模型做个综述介绍，并针对（3）具体的划分方式，对应给出方法构建指导。","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"大模型知识库大体框架：","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（1）如何构建的知识库；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（2）如何构建的智能体Agent；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（3）所构建知识库与当前开源大模型在垂直领域知识方面的优势，并展示问答效果（这个可参考一些LLM或MLLMs工作，看他们如何和GPT来做对比的）；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（4）所构建的智能体Agent比起通用的大模型（比如DeepSeek、Qwen等）在面向垂直领域推理能力方面的优势；","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"（5）展示利用所构建的大模型知识库，来辅助写这篇综述文章内容的问答生成效果，体现出从一般到好的效果，既构建了大模型知识库，又辅助写了这篇综述，体现利用AI大模型工具的有效性和实用性。","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[{"detail":0,"format":0,"mode":"normal","style":"","text":"最后写结论","type":"text","version":1}],"direction":"ltr","format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""},{"children":[],"direction":null,"format":"","indent":0,"type":"paragraph","version":1,"textFormat":0,"textStyle":""}],"direction":"ltr","format":"","indent":0,"type":"root","version":1}}'
